# Crawler Engine (Go) 本地编排：MySQL + Redis + API + Worker
# 用法：docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shikues_crawler
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args: { CMD: crawler-api }
    command: ["-config", "/app/configs/config.yaml", "-addr", ":8088"]
    environment:
      CW_MYSQL_HOST: mysql
      CW_REDIS_HOST: redis
    ports:
      - "8088:8088"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      args: { CMD: crawler-worker }
    command: ["-config", "/app/configs/config.yaml", "-consumer", "worker-compose-1", "-idle-rounds", "-1"]
    environment:
      CW_MYSQL_HOST: mysql
      CW_REDIS_HOST: redis
    depends_on:
      api: { condition: service_started }
    deploy:
      replicas: 2

volumes:
  mysql-data:
  redis-data:
