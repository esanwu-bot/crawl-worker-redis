; ============================================================
; 方案一：多进程高并发 Worker（supervisor 守护）
;
; 用法：
;   1) 修改下方 ENV_CW_HOME 与实际 Redis/MySQL 环境变量
;   2) ln -s 本文件 /etc/supervisor/conf.d/crawl-worker.conf   (Debian/Ubuntu)
;      cp 本文件 /etc/supervisord.d/crawl-worker.ini           (CentOS)
;   3) supervisorctl reread && supervisorctl update
;   4) supervisorctl status crawl-worker:*
;
; 说明：
;   - numprocs = 并发进程数。consumer 名 w-%(process_num)02d 在本机唯一；
;     若多台机器连同一 Redis，请把机器名拼进去，例如
;     command=php ... --name w-%(ENV_HOSTNAME)s-%(process_num)02d
;   - 进程被 stop/异常退出后 supervisor 拉起，新进程会先 XCLAIM 接管 PEL 遗留任务。
; ============================================================

[supervisord]
nodaemon=false

[program:crawl-worker]
process_name=%(program_name)s-%(process_num)02d
command=php %(ENV_CW_HOME)s/bin/worker.php --name w-%(process_num)02d --idle-rounds 0
numprocs=8
directory=%(ENV_CW_HOME)s
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=%(ENV_CW_HOME)s/logs/supervisor-worker.log
stderr_logfile=%(ENV_CW_HOME)s/logs/supervisor-worker-err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

; ---- 环境注入（按需修改，不要提交真实凭据到 git）----
; 远程 Redis 连接全部走环境变量（仓库 config 默认 127.0.0.1 无密码，不含真实凭据）
environment=
    CW_HOME="%(ENV_CW_HOME)s",
    CW_REDIS_HOST="__YOUR_REDIS_HOST__",
    CW_REDIS_PORT="6379",
    CW_REDIS_AUTH="__YOUR_REDIS_PASSWORD__",
    CW_REDIS_PREFIX="cw:shikues:",
    CW_MYSQL_HOST="127.0.0.1",
    CW_MYSQL_PORT="3306",
    CW_MYSQL_USER="root",
    CW_MYSQL_PASS="root",
    CW_MYSQL_DB="shikues_crawler",
    CW_CLAIM_IDLE_MS="60000",
    CW_PROXY_ENABLED="0"

; ---- supervisor 需要知道的进程环境变量（在 /etc/supervisor/supervisord.conf 的 [supervisord] 下声明）----
; [supervisord]
; environment=CW_HOME="/data/crawl-worker-redis"
