    <!-- ============ SCENE 0 开场 ============ -->
    <div class="scene s0">
      <div class="brand s0brand">
        <span class="dot"></span>
        <span class="bn">crawl-worker-redis</span>
      </div>
      <div class="tchips">
        <span class="tchip">PHP 8</span>
        <span class="tchip">Redis Streams</span>
        <span class="tchip">MySQL</span>
      </div>
      <div class="s0 s0kc hd">
        <span class="kick">多进程 · 队列化 · 高并发采集框架</span>
      </div>
      <div class="s0 s0t grad">crawl-worker-redis</div>
      <div class="s0 s0u"></div>
      <div class="s0 s0s">一条消息 = 一次采集单元（API / 链接）</div>
      <div class="s0 kchips">
        <span class="kc"><i>①</i>Redis Stream 任务队列</span>
        <span class="kc"><i>②</i>N 进程 Worker 并发消费</span>
        <span class="kc"><i>③</i>MySQL 幂等结果落库</span>
      </div>
    </div>

    <!-- ============ SCENE 1 架构 ============ -->
    <div class="scene s1" id="sc1">
      <div class="hd">
        <span class="kick">架构总览</span>
        <div class="h2">生产 → 队列 → 多进程 → 结果</div>
      </div>
      <div class="node n1">
        <div class="nt">PRODUCER</div>
        <div class="nm">播种 / 调度</div>
        <div class="nd">seed.php 发现系列<br />XADD 任务入队</div>
      </div>
      <div class="node n2">
        <div class="nt">REDIS STREAM</div>
        <div class="nm">任务队列</div>
        <div class="nd">消费组 workers<br />PEL · 死信 · 游标</div>
      </div>
      <div class="node n3">
        <div class="nt">WORKERS × N</div>
        <div class="nm">无状态执行体</div>
        <div class="nd">w-主机-pid<br />领取 → 抓取 → ACK</div>
      </div>
      <div class="node n4">
        <div class="nt">MYSQL</div>
        <div class="nm">结果层</div>
        <div class="nd">unique upsert<br />幂等汇聚</div>
      </div>
      <span class="arrow a1">&#8594;</span>
      <span class="arrow a2">&#8594;</span>
      <span class="arrow a3">&#8594;</span>
      <span class="packet" data-layout-allow-overlap data-layout-allow-occlusion>XADD 任务</span>
      <div class="bullets">
        <span class="bul">同一消息只被一个 Worker 领取</span>
        <span class="bul">同系列翻页串行 · 不同系列全并行</span>
        <span class="bul">加进程即线性扩容</span>
      </div>
    </div>

    <!-- ============ SCENE 2 消息生命周期 ============ -->
    <div class="scene s2" id="sc2">
      <div class="hd">
        <span class="kick">队列语义 · 一条消息的旅程</span>
        <div class="h2">分发 · 重试 · 死信，全部内建</div>
      </div>
      <div class="rail"></div>
      <div class="row r1">
        <span class="ic">1</span>
        <div class="rtx">
          <div class="tt">投递 — Producer 把一次抓取封装为<em>消息</em></div>
          <div class="td">任务 = type_id + 页码 / 链接，写进 Redis Stream</div>
        </div>
      </div>
      <div class="row r2">
        <span class="ic">2</span>
        <div class="rtx">
          <div class="tt">领取 — 消费组把消息<em>唯一派发</em>给一个 Worker</div>
          <div class="td">消息进入该进程的 PEL，成为 in-flight 私有任务</div>
        </div>
      </div>
      <div class="row r3">
        <span class="ic">3</span>
        <div class="rtx">
          <div class="tt">成败 — 成功 <em>XACK</em> 终结 / 失败不确认留在 PEL</div>
          <div class="td">MySQL unique upsert：重放也不会产生脏数据</div>
        </div>
      </div>
      <div class="row r4">
        <span class="ic">4</span>
        <div class="rtx">
          <div class="tt">恢复 — 超过 claim_idle 未确认，任意进程 <em>XCLAIM 接管</em></div>
          <div class="td">进程崩溃、慢任务拖尾都能自动续跑</div>
        </div>
      </div>
      <div class="row r5">
        <span class="ic">5</span>
        <div class="rtx">
          <div class="tt">兜底 — 重试达到上限转入<em>死信流</em></div>
          <div class="td">可观测、可补偿、不阻塞正常消费</div>
        </div>
      </div>
    </div>

    <!-- ============ SCENE 3 核心能力 ============ -->
    <div class="scene s3" id="sc3">
      <div class="hd">
        <span class="kick">核心能力</span>
        <div class="h2">崩溃可恢复 · 重复不脏库 · 全队友好协作</div>
      </div>
      <div class="card cA c1">
        <span class="num">01</span>
        <div class="ct">游标断点续采</div>
        <div class="cd">cur:{id} 记录进度与页码，<br />重启后自动从断点继续</div>
      </div>
      <div class="card cA c2">
        <span class="num">02</span>
        <div class="ct">追加锁 · 幂等闸门</div>
        <div class="cd">并发 Worker 下「下一页」<br />只会被投递一次</div>
      </div>
      <div class="card cA c3">
        <span class="num">03</span>
        <div class="ct">失败接管与重试</div>
        <div class="cd">不 ACK + XCLAIM，崩溃消息<br />由健康进程自动接力</div>
      </div>
      <div class="card cB c1">
        <span class="num">04</span>
        <div class="ct">幂等落库</div>
        <div class="cd">MySQL unique upsert，<br />任意重放结果一致</div>
      </div>
      <div class="card cB c2">
        <span class="num">05</span>
        <div class="ct">代理池 Redis 化</div>
        <div class="cd">坏代理剔除 / 冷却恢复，<br />多进程共享同一份健康状态</div>
      </div>
      <div class="card cB c3">
        <span class="num">06</span>
        <div class="ct">优雅退出</div>
        <div class="cd">SIGTERM 收尾当前任务，<br />supervisor 自动拉起新进程</div>
      </div>
    </div>

    <!-- ============ SCENE 4 收尾 ============ -->
    <div class="scene s4" id="sc4">
      <div class="hd">
        <span class="kick">开箱即用</span>
      </div>
      <div class="big grad">一条消息 · 一次采集</div>
      <div class="sub">采集 API / 链接 队列化，多进程 / 多机线性扩容</div>
      <div class="cmd">$ php bin/seed.php&#8195;&#8594;&#8195;php bin/worker.php</div>
      <div class="techs">
        <span class="tc">PHP 常驻进程</span>
        <span class="tc">Redis Streams</span>
        <span class="tc">MySQL unique</span>
        <span class="tc">cURL + 代理池</span>
        <span class="tc">Supervisor</span>
      </div>
      <div class="repo">github.com/esanwu-bot/crawl-worker-redis</div>
    </div>

    <script>
      (function () {
        var ROOT = '[data-composition-id="promo"] ';
        function el(sel) {
          return document.querySelector(ROOT + sel);
        }
        function set(sel, vars) {
          tl.set(ROOT + sel, vars, 0);
        }
        function to(sel, vars, pos) {
          tl.to(ROOT + sel, vars, pos);
        }
        function ff(sel, vars, pos) {
          tl.fromTo(
            ROOT + sel,
            { autoAlpha: 0, y: 0 },
            vars,
            pos
          );
        }
        var tl = gsap.timeline({
          paused: true,
          defaults: { ease: "power3.out" }
        });

        /* ===== S0 开场 0–3.2s ===== */
        set(".s0 .brand", { autoAlpha: 0 });
        set(".s0 .tchip", { autoAlpha: 0, x: 12 });
        set(".s0 .s0kc", { autoAlpha: 0, y: 20 });
        set(".s0 .s0t", { autoAlpha: 0, y: 34 });
        set(".s0 .s0u", { scaleX: 0, autoAlpha: 0 });
        set(".s0 .s0s", { autoAlpha: 0, y: 18 });
        set(".s0 .kc", { autoAlpha: 0, y: 22 });

        to(".s0 .brand", { autoAlpha: 1, duration: 0.4 }, 0.06);
        to(".s0 .tchip", { autoAlpha: 1, x: 0, duration: 0.35 }, 0.12);
        to(".s0 .s0kc", { autoAlpha: 1, y: 0, duration: 0.5 }, 0.32);
        to(".s0 .s0t", { autoAlpha: 1, y: 0, duration: 0.8 }, 0.55);
        to(".s0 .s0u", { scaleX: 1, autoAlpha: 1, duration: 0.7, ease: "power2.inOut" }, 1.0);
        to(".s0 .s0s", { autoAlpha: 1, y: 0, duration: 0.6 }, 1.12);
        to(".s0 .kc", { autoAlpha: 1, y: 0, duration: 0.5, stagger: 0.1 }, 1.6);
        to(".s0", { autoAlpha: 0, duration: 0.16 }, 3.04);
